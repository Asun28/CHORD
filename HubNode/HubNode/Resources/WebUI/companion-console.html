  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element  -  warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags  -  manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames  -  from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below  -  so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document  -  a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts  -  file://  -  everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe)  -  location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match  -  accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative  -  never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate  -  a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor')  -  an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent  -  the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs  - 
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here  -  they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin  -  blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec  -  re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page  -  from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

und\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\"></rect><path d=\"M5 15V5a2 2 0 0 1 2-2h10\"></path></svg>{{ n.copyLabel }}</button>\n </div>\n <p style=\"font-size: 14px; color: #4A4A46;\">Nothing is posted for you - the text opens in your own app to send. Names, phone numbers and house numbers are stripped; the community-hub footer and 111 line are always attached. The share is written to the message register.</p>\n </div>\n </details>\n </sc-if>\n <sc-if value=\"{{ n.noShare }}\" hint-placeholder-val=\"{{ false }}\">\n <p data-noprint=\"1\" style=\"padding: 10px 12px; background: #F7F7F5; border: 1px solid #DCDCD8; border-radius: 4px; font-size: 14px; color: #4A4A46;\">Sharing is blocked on this item - welfare and life-threatening needs are never broadcast. It goes to 111, the EOC and the door-knock team.</p>\n </sc-if>\n </div>\n </details>\n </li>\n </sc-for>\n </ul>\n </div>\n\n <div style=\"flex: 1 1 340px; min-width: 0;\">\n <h2 style=\"font-size: 20px; font-weight: 800; color: #000000;\">{{ matchPanelTitle }}</h2>\n\n <sc-if value=\"{{ matching }}\" hint-placeholder-val=\"{{ false }}\">\n <div style=\"margin-top: 10px; padding: 16px; background: #FFFFFF; border: 2px solid #000000; border-radius: 4px; display: grid; gap: 12px;\">\n <p style=\"font-size: 16px;\"><strong>Need:</strong> {{ matchNeedText }}</p>\n <p style=\"font-size: 14px; color: #4A4A46;\">{{ candidateRule }}</p>\n <ul style=\"display: grid; gap: 8px;\">\n <sc-for list=\"{{ candidates }}\" as=\"o\" hint-placeholder-count=\"2\">\n <li>\n <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" aria-pressed=\"{{ o.pressed }}\" style=\"width: 100%; text-align: left; padding: 12px 14px; background: {{ o.bg }}; border: 2px solid {{ o.border }}; border-radius: 4px; font-family: inherit; cursor: pointer;\">\n <span style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: #767671;\">\n <strong style=\ r: #000000; border: 2px solid #000000; border-radius: 4px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;\">Cancel</button>\n </div>\n </div>\n </sc-if>\n\n <sc-if value=\"{{ notMatching }}\" hint-placeholder-val=\"{{ true }}\">\n <ul style=\"margin-top: 10px; display: grid; gap: 10px;\">\n <sc-for list=\"{{ offerRows }}\" as=\"o\" hint-placeholder-count=\"9\">\n <li>\n <details style=\"background: #FFFFFF; border: 1px solid #DCDCD8; border-left: 5px solid {{ o.rule }}; border-radius: 4px;\">\n <summary style=\"padding: 13px 15px; display: flex; gap: 10px; align-items: flex-start;\">\n <span style=\"flex: 1 1 auto; min-width: 0; display: grid; gap: 4px;\">\n <span style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: #767671;\">\n <strong style=\"color: #000000; font-variant-numeric: tabular-nums; font-size: 14px;\">{{ o.time }}</strong>\n <span style=\"padding: 1px 8px; background: #F7F7F5; border: 1px solid #DCDCD8; border-radius: 999px; font-size: 12px; font-weight: 700;\">{{ o.category }}</span>\n <span style=\"padding: 1px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; background: {{ o.state.bg }}; color: {{ o.state.ink }};\">{{ o.state.label }}</span>\n </span>\n <span style=\"font-size: 16px; font-weight: 700; color: #000000; text-wrap: pretty;\">{{ o.description }}</span>\n </span>\n <svg class=\"om-caret\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4A4A46\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"6 9 12 15 18 9\"></polyline></svg>\n </summary>\n <div style=\"padding: 0 15px 15px; border-top: 1px solid #DCDCD8; display: grid; gap: 8px;\">\n <p style=\"margin-top: 12px; font-size: 15px;\"><strong>Offered by:</strong> {{ o.name }}</p>\n <p style=\"font-size: 15px;\"><strong>Contact:</strong> {{ o.contact }}</p>\n <sc-if value=\"{{ o.canShare }}\" hint-placeholder-val=\"{ s: baseline; font-size: 13px; color: #767671;\">\n <strong style=\"color: #000000; font-size: 14px; font-variant-numeric: tabular-nums;\">{{ m.time }}</strong>\n <span>{{ m.pair }} · matched by {{ m.by }}</span>\n </span>\n <p style=\"margin-top: 4px; font-size: 15px;\">{{ m.note }}</p>\n </li>\n </sc-for>\n </ul>\n </section>\n </sc-if>\n\n <!-- ══════ ROLES, ROSTER & TASKS ══════ -->\n <sc-if value=\"{{ showRoster }}\" hint-placeholder-val=\"{{ false }}\">\n <section data-screen-label=\"Roles roster and tasks\">\n <h1 style=\"font-size: clamp(26px, 5vw, 34px); font-weight: 800; letter-spacing: -0.03em; color: #000000;\">{{ ui.hRoster }}</h1>\n <p style=\"margin-top: 6px; font-size: 17px; color: #4A4A46; max-width: 68ch;\">The eight roles from the guide, who is holding them this shift, and every job with an owner and a time. Unfilled and unassigned are loud states - unassigned work is the most dangerous state in a response.</p>\n\n <div data-noprint=\"1\" style=\"margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;\">\n <sc-for list=\"{{ shiftTabs }}\" as=\"sh\" hint-placeholder-count=\"2\">\n <button type=\"button\" sc-camel-on-click=\"{{ sh.go }}\" aria-pressed=\"{{ sh.pressed }}\" style=\"min-height: 48px; padding: 8px 16px; display: grid; gap: 1px; text-align: left; background: {{ sh.bg }}; color: #000000; border: 2px solid #000000; border-radius: 4px; font-family: inherit; cursor: pointer;\">\n <span style=\"font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums;\">{{ sh.label }}</span>\n <span style=\"font-size: 13px; font-weight: 600; color: #4A4A46;\">{{ sh.note }}</span>\n </button>\n </sc-for>\n <span style=\"font-size: 16px; font-weight: 700; color: #000000;\">{{ coverageLine }}</span>\n </div>\n\n <ul style=\"margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px;\">\n <sc-for list=\"{{ roleCards }}\" as=\"r\" hint-placeholder-count=\"8\">\n <li style=\"background: {{ r.bg }}; border: 1px solid {{ r.border }}; border-top: 4px solid {{ r.rule }}; border-radius: 4px; padding: 14px 16px; display: grid; gap: 10px; align-content: start;\">\n <span style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;\">\n <strong style=\"font-size: 17px; color: #000000;\">{{ r.role }}</strong>\n <span style=\"padding: 2px 9px; border-radius: 4px; font-size: 12px; font-weight: 800; background: {{ r.badge.bg }}; color: {{ r.badge.ink }};\">{{ r.badge.label }}</span>\n </span>\n <ul style=\"display: grid; gap: 6px;\">\n <sc-for list=\"{{ r.people }}\" as=\"p\" hint-placeholder-count=\"1\">\n <li style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; background: #F7F7F5; border: 1px solid #DCDCD8; border-radius: 4px;\">\n <span style=\"flex: 1 1 140px; min-width: 0; display: grid; gap: 1px;\">\n <strong style=\"font-size: 15px; color: #000000;\">{{ p.name }}</strong>\n <span style=\"font-size: 13px; color: #4A4A46;\">{{ p.detail }}</span>\n <span style=\"font-size: 12px; font-weight: 700; color: #8A5A00;\">{{ p.breakNote }}</span>\n </span>\n <button type=\"button\" sc-camel-on-click=\"{{ p.remove }}\" aria-label=\"Remove {{ p.name }} from {{ r.role }}\" style=\"width: 44px; height: 44px; flex: none; display: grid; place-items: center; background: #FFFFFF; color: #B3261E; border: 2px solid #DCDCD8; border-radius: 4px; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer;\" style-hover=\"border-color: #B3261E;\">×</button>\n </li>\n </sc-for>\n </ul>\n <sc-if value=\"{{ r.countLabel }}\" hint-placeholder-val=\"{{ false }}\">\n <span style=\"font-size: 13px; font-weight: 700; color: #0B6B3A;\">{{ r.countLabel }}</span>\n </sc-if>\n <label style=\"display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: #4A4A46;\">Add someone - a role can be shared\n <sc-raw-select value=\"{{ r.value }}\" sc-camel-on-change=\"{{ r.setPerson }}\" style=\"min-height: 44px; width: 100%; padding: 0 8px; background: #FFFFFF; border: 2px solid #767671; border-radius: 4px; font-family: inherit; font-size: 15px; font-weight: 700;\">\n <sc-for list=\"{{ r.options }}\" as=\"op\" hint-placeholder-count=\"13\">\n <option value=\"{{ op.name }}\">{{ op.option }}</option>\n </sc-for>\n </sc-raw-select>\n </label>\n <sc-if value=\"{{ r.doubleHatted }}\" hint-placeholder-val=\"{{ false }}\">\n <span style=\"padding: 8px 10px; background: #FFF3A8; border: 1px solid #8A5A00; border-radius: 4px; font-size: 13px; font-weight: 700; color: #5C4E00;\">{{ r.doubleHatted }}</span>\n </sc-if>\n <details>\n <summary style=\"min-height: 44px; display: flex; gap: 10px; align-items: center; font-size: 15px; font-weight: 700; color: #0B4EA2;\">\n <span style=\"flex: 1 1 auto;\">What this role does</span>\n <svg class=\"om-caret\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4A4A46\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"6 9 12 15 18 9\"></polyline></svg>\n </summary>\n <ul style=\"display: grid; gap: 6px; padding-top: 6px;\">\n <sc-for list=\"{{ r.tasks }}\" as=\"t\" hint-placeholder-count=\"4\">\n <li>\n <button type=\"button\" sc-camel-on-click=\"{{ t.toggle }}\" aria-pressed=\"{{ t.done }}\" style=\"width: 100%; min-height: 44px; display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 6px 0; background: transparent; border: 0; font-family: inherit; cursor: pointer;\">\n <span aria-hidden=\"true\" style=\"flex: none; width: 24px; height: 24px; display: grid; place-items: center; margin-top: 1px; background: {{ t.markBg }}; color: {{ t.markInk }}; border: 2px solid #767671; border-radius: 3px; font-size: 15px; font-weight: 800;\">{{ t.mark }}</span>\n <span style=\"flex: 1 1 auto; font-size: 15px; color: {{ t.ink }}; text-decoration: {{ t.deco }}; text-wrap: pretty;\">{{ t.text }}</span>\n </button>\n <sc-if value=\" x; padding: 0 16px; background: #FFDD00; color: #000000; border: 2px solid #000000; border-radius: 4px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;\">{{ ui.bTake }}</button>\n </sc-if>\n </div>\n\n <div style=\"display: grid; gap: 8px; padding: 12px; background: #F7F7F5; border: 1px solid #DCDCD8; border-radius: 4px;\">\n <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #767671;\">{{ ui.lHow }}</span>\n <ol style=\"display: grid; gap: 6px;\">\n <sc-for list=\"{{ t.how }}\" as=\"h\" hint-placeholder-count=\"4\">\n <li style=\"display: flex; gap: 8px; font-size: 15px; text-wrap: pretty;\"><strong style=\"flex: none; color: #0B4EA2;\">{{ h.n }}</strong><span>{{ h.text }}</span></li>\n </sc-for>\n </ol>\n <span style=\"display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px;\">\n <span><strong>{{ ui.lWhen }}:</strong> {{ t.when }}</span>\n <span><strong>{{ ui.lWhere }}:</strong> {{ t.where }}</span>\n </span>\n <span style=\"font-size: 14px;\"><strong>Check it against:</strong> {{ t.ref }} - <a href=\"{{ t.refUrl }}\" target=\"_blank\" rel=\"noopener noreferrer\">wremo.nz</a>, or the printed guide.</span>\n </div>\n\n <div data-noprint=\"1\" style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n <sc-for list=\"{{ t.steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n <button type=\"button\" sc-camel-on-click=\"{{ s.go }}\" aria-pressed=\"{{ s.pressed }}\" style=\"min-height: 44px; padding: 0 14px; background: {{ s.bg }}; color: {{ s.ink }}; border: 2px solid #DCDCD8; border-radius: 4px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;\">{{ s.label }}</button>\n </sc-for>\n </div>\n\n <sc-if value=\"{{ t.updates }}\" hint-placeholder-val=\"{{ true }}\">\n <ul style=\"display: grid; gap: 6px;\">\n <sc-for list=\"{{ t.updates }}\" as=\"u\" hint-placeholder-count=\"2\">\n <li style=\"padding-left: 12px; border-left: 3px solid #DCDCD8; font-size: 15px; color -weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #767671;\">Layers</span>\n <sc-for list=\"{{ feedChips }}\" as=\"c\" hint-placeholder-count=\"8\">\n <button type=\"button\" sc-camel-on-click=\"{{ c.go }}\" aria-pressed=\"{{ c.pressed }}\" style=\"min-height: 44px; padding: 0 14px; background: {{ c.bg }}; color: {{ c.ink }}; border: 2px solid #000000; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;\">{{ c.label }}</button>\n </sc-for>\n </div>\n <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center;\">\n <span style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #767671;\">Severity</span>\n <sc-for list=\"{{ sevChips }}\" as=\"c\" hint-placeholder-count=\"5\">\n <button type=\"button\" sc-camel-on-click=\"{{ c.go }}\" aria-pressed=\"{{ c.pressed }}\" style=\"min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; background: {{ c.bg }}; color: {{ c.ink }}; border: 2px solid {{ c.border }}; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;\"><span aria-hidden=\"true\" style=\"width: 10px; height: 10px; border-radius: 999px; background: currentColor;\"></span>{{ c.label }}</button>\n </sc-for>\n <button type=\"button\" sc-camel-on-click=\"{{ resetFilters }}\" style=\"min-height: 44px; padding: 0 14px; background: transparent; color: #0B4EA2; border: 0; font-family: inherit; font-size: 14px; font-weight: 700; text-decoration: underline; cursor: pointer;\">{{ ui.bReset }}</button>\n </div>\n <p style=\"font-size: 15px; color: #4A4A46;\">Showing {{ monitorCount }} of {{ monitorTotal }} items.</p>\n </div>\n\n <div style=\"margin-top: 12px; display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch;\">\n <div style=\"flex: 2 1 360px; min-width: 0; display: grid; gap: 8px;\">\n <p style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;\">{{ mapSummary }}</p>\n <div ref=\"{{ mapRef }}\" style=\"height: clamp(320px, 52vh, 560px); background: #DCDCD8; border: 1px solid #DCDCD8; border-radius: 4px;\"></div>\n <p style=\"font-size: 13px; color: #767671; text-wrap: pretty;\">{{ mapNotice }}</p>\n </div>\n\n <div style=\"flex: 1 1 320px; min-width: 0; display: grid; gap: 8px; align-content: start; max-height: clamp(320px, 52vh, 560px); overflow-y: auto;\">\n <sc-for list=\"{{ monitorRows }}\" as=\"m\" hint-placeholder-count=\"8\">\n <button type=\"button\" sc-camel-on-click=\"{{ m.go }}\" style=\"width: 100%; text-align: left; padding: 12px 14px; background: {{ m.bg }}; border: 1px solid {{ m.border }}; border-left: 5px solid {{ m.sevInk }}; border-radius: 4px; font-family: inherit; cursor: pointer;\">\n <span style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: #767671;\">\n <strong style=\"font-size: 13px; color: #000000; font-variant-numeric: tabular-nums;\">{{ m.time }}</strong>\n <span style=\"padding: 1px 8px; border-radius: 4px; font-weight: 700; background: {{ m.sevBg }}; color: {{ m.sevInk }};\">{{ m.sevLabel }}</span>\n <span>{{ m.feed }}</span>\n </span>\n <span style=\"display: block; margin-top: 3px; font-size: 16px; font-weight: 700; color: #000000; text-wrap: pretty;\">{{ m.title }}</span>\n <span style=\"display: block; font-size: 14px; color: #4A4A46;\">{{ m.detail }}</span>\n </button>\n </sc-for>\n </div>\n </div>\n\n <p style=\"margin-top: 14px; padding: 14px; background: #FFF3A8; border: 1px solid #8A5A00; border-radius: 4px; font-size: 15px; color: #5C4E00; max-width: 80ch;\">This screen never issues a warning. GeoNet data is supplied without warranty; MetService is relayed from the open CAP feed; NEMA polygons are supplementary. The radio and official channels stay canonical - you will not be alerted here.</p>\n </section>\n </sc-if>\n\n <!-- ══════ STATUS REPORT ══════ -->\n <sc-if value=\"{{ showSitrep }}\" hint-placeholder-val=\"{{ false }}\">\n <section data-screen-label=\"Status report\">\n <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between;\">\n <div>\n <h1 style=\"font-size: clamp(26px, 5vw, 34px); font-weight: 800; letter-spacing: -0.03em; color: #000000;\">{{ ui.hSitrep }}</h1>\n <p style=\"margin-top: 6px; font-size: 17px; color: #4A4A46; max-width: 62ch;\">Compiled from the board as it stands right now - {{ clock }}. Read it over VHF, or print it and hand it over.</p>\n </div>\n <div data-noprint=\"1\" style=\"display: flex; flex-wrap: wrap; gap: 10px;\">\n <button type=\"button\" sc-camel-on-click=\"{{ printPage }}\" style=\"min-height: 48px; padding: 0 18px; background: #000000; color: #FFFFFF; border: 0; border-radius: 4px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;\">{{ ui.bPrint }}</button>\n <button type=\"button\" sc-camel-on-click=\"{{ toggleScript }}\" aria-pressed=\"{{ scriptPressed }}\" style=\"min-height: 48px; padding: 0 18px; background: {{ scriptBg }}; color: #000000; border: 2px solid #000000; border-radius: 4px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;\">{{ scriptLabel }}</button>\n </div>\n </div>\n\n <sc-if value=\"{{ showScript }}\" hint-placeholder-val=\"{{ false }}\">\n <div style=\"margin-top: 18px; padding: 18px; background: #000000; color: #FFFFFF; border-radius: 4px;\">\n <p style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #FFDD00;\">Radio script · read slowly · target 90 seconds</p>\n <pre style=\"margin: 12px 0 0; white-space: pre-wrap; font-family: inherit; font-size: clamp(17px, 2.6vw, 20px); line-height: 1.7;\">{{ radioScript }}</pre>\n </div>\n </sc-if>\n\n <div style=\"margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px;\">\n <sc-for list=\"{{ sitrepBlocks }}\" as=\"b\" hint-placeholder-count=\"5\">\n <div style=\"padding: 16px; background: #FFFFFF; border: 1px solid #DCDCD8; border-top: 4px solid {{ b.rule }}; border-radius: 4px;\">\n <h2 style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #767671;\">{{ b.title }}</h2>\n <ul style=\"margin-top: 8px; display: grid; gap: 7px;\">\n <sc-for list=\"{{ b.lines }}\" as=\"l\" hint-placeholder-count=\"3\">\n <li style=\"font-size: 16px; padding-left: 14px; border-left: 3px solid #EDEDEA; text-wrap: pretty;\">{{ l.text }}</li>\n </sc-for>\n </ul>\n </div>\n </sc-for>\n </div>\n\n <p style=\"margin-top: 16px; font-size: 15px; color: #4A4A46; max-width: 70ch;\">Redaction is applied once, for every channel - file, REST, A2A, MCP. Names, phone numbers and house numbers are removed; streets, categories and counts travel. Turning it off needs the Hub Supervisor.</p>\n </section>\n </sc-if>\n\n <!-- ══════ PUBLIC INFORMATION ══════ -->\n <sc-if value=\"{{ showPublic }}\" hint-placeholder-val=\"{{ false }}\">\n <section data-screen-label=\"Public information\">\n <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between;\">\n <div>\n <h1 style=\"font-size: clamp(26px, 5vw, 34px); font-weight: 800; letter-spacing: -0.03em; color: #000000;\">{{ ui.hPublic }}</h1>\n <p style=\"margin-top: 6px; font-size: 17px; color: #4A4A46; max-width: 62ch;\">What goes on the wall. Official messages are relayed word for word with a time and a source. Nothing unconfirmed goes up without the label.</p>\n </div>\n <button data-noprint=\"1\" type=\"button\" sc-camel-on-click=\"{{ toggleLarge }}\" aria-pressed=\"{{ largePressed }}\" style=\"min-height: 48px; padding: 0 18px; background: {{ largeBg }}; color: #000000; border: 2px solid #000000; border-radius: 4px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;\">{{ largeLabel }}</button>\n </div>\n\n <ul style=\"margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px;\">\n <sc-for list=\"{{ pubRows }}\" as=\"p\" hint-placeholder-count=\"7\">\n <li style=\"padding: 16px; background: #FFFFFF; border: 1px solid #DCDCD8; border-top: 5px solid {{ p.rule }}; border-radius: 4px;\">\n <span style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center;\">\n <strong style=\"font-size: 14px; font-variant-numeric: tabular-nums; color: #000000;\">{{ p.time }}</strong>\n <span style=\"padding: 2px 9px; border-radius: 4px; font-size: 13px; font-weight: 700; background: {{ p.prov.bg }}; color: {{ p.prov.ink }};\">{{ p.prov.label }}</span>\n </span>\n <p style=\"margin-top: 8px; font-size: {{ p.size }}; font-weight: {{ p.weight }}; line-height: 1.45; color: #000000; text-wrap: pretty;\">{{ p.message }}</p>\n </li>\n </sc-for>\n </ul>\n </section>\n </sc-if>\n\n <!-- ══════ CHECKER ══════ -->\n <sc-if value=\"{{ showChecker }}\" hint-placeholder-val=\"{{ false }}\">\n <section data-screen-label=\"Am I impacted checker\">\n <h1 style=\"font-size: clamp(26px, 5vw, 34px); font-weight: 800; letter-spacing: -0.03em; color: #000000;\">Am I impacted?</h1>\n <p style=\"margin-top: 6px; font-size: 17px; color: #4A4A46; max-width: 64ch;\">Point in polygon against cached official zones. No model anywhere in this path. Near a boundary, the answer rounds towards the more severe zone.</p>\n\n <div style=\"margin-top: 18px; padding: 16px; background: #000000; color: #FFFFFF; border-radius: 4px;\">\n <strong style=\"font-size: clamp(19px, 3.4vw, 23px); line-height: 1.35; display: block; text-wrap: pretty;\">{{ ui.naturalWarning }}</strong>\n <span style=\"display: block; margin-top: 8px; font-size: 14px; color: #FFDD00;\">{{ ui.onFoot }}</span>\n </div>\n\n <div data-noprint=\"1\" style=\"margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px;\">\n <sc-for list=\"{{ checkPoints }}\" as=\"c\" hint-placeholder-count=\"4\">\n <button type=\"button\" sc-camel-on-click=\"{{ c.go }}\" aria-pressed=\"{{ c.pressed }}\" style=\"min-height: 48px; padding: 0 16px; background: {{ c.bg }}; color: #000000; border: 2px solid #000000; border-radius: 4px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;\">{{ c.label }}</button>\n </sc-for>\n </div>\n\n <div style=\"margin-top: 16px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start;\">\n <div style=\"flex: 1 1 340px; min-width: 0; padding: 18px; background: {{ result.bg }}; border: 2px solid {{ result.ink }}; border-radius: 4px;\">\n <span style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: {{ result.ink }};\"><span style=\"width: 10px; height: 10px; border-radius: 999px; background: currentColor;\"></span>{{ result.zone }}</span>\n <h2 style=\"margin-top: 6px; font-size: clamp(22px, 4vw, 28px); font-weight: 800; color: #000000; text-wrap: pretty;\">{{ result.headline }}</h2>\n <p style=\"margin-top: 10px; font-size: 17px; color: #1A1A18; text-wrap: pretty;\">{{ result.instruction }}</p>\n <p style=\"margin-top: 12px; font-size: 14px; color: #4A4A46;\">{{ result.provenance }}</p>\n </div>\n <div style=\"flex: 1 1 260px; min-width: 0; padding: 18px; background: #FFFFFF; border: 1px solid #DCDCD8; border-top: 4px solid #FFDD00; border-radius: 4px;\">\n <h2 style=\"font-size: 18px; font-weight: 800; color: #000000;\">Nearest hub</h2>\n <p style=\"margin-top: 6px; font-size: 16px;\"><strong>Island Bay Community Emergency Hub</strong><br>{{ result.distance }} - direction only, no route.</p>\n <p style=\"margin-top: 10px; font-size: 15px; color: #4A4A46;\">Roads may be blocked. Use your local knowledge. Hubs open when community members open them; status shows only if the hub is running this app.</p>\n <p style=\"margin-top: 10px; font-size: 13px; color: #767671;\">Hub locations: Greater Wellington / WREMO hubs layer, CC BY-NC-ND 4.0. Zones: WCC tsunami evacuation zones.</p>\n </div>\n </div>\n </section>\n </sc-if>\n\n <!-- ══════ ASSISTANT ══════ -->\n <sc-if value=\"{{ showAssist }}\" hint-placeholder-val=\"{{ false }}\">\n <section data-screen-label=\"Ops assistant\">\n <h1 style=\"font-size: clamp(26px, 5vw, 34px); font-weight: 800; letter-spacing: -0.03em; color: #000000;\">Ask Kea</h1>\n <p style=\"margin-top: 6px; font-size: 17px; color: #4A4A46; max-width: 64ch;\">Answers come only from the Hub Guide and the local Community Response Plan, held on this device, with a page reference on every answer. Personal-safety questions get a fixed answer, never reasoning.</p>\n\n <ul style=\"margin-top: 18px; display: grid; gap: 10px; max-width: 860px;\">\n <sc-for list=\"{{ assistRows }}\" as=\"a\" hint-placeholder-count=\"4\">\n <li>\n <details style=\"background: #FFFFFF; border: 1px solid #DCDCD8; border-left: 5px solid {{ a.rule }}; border-radius: 4px;\">\n <summary style=\"padding: 14px 16px; display: flex; gap: 12px; align-items: center;\">\n <span style=\"flex: 1 1 auto; min-width: 0; font-size: 17px; font-weight: 700; color: #000000; text-wrap: pretty;\">{{ a.q }}</span>\n <span style=\"flex: none; padding: 2px 9px; border-radius: 4px; font-size: 12px; font-weight: 700; background: {{ a.tag.bg }}; color: {{ a.tag.ink }};\">{{ a.tag.label }}</span>\n <svg class=\"om-caret\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4A4A46\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"6 9 12 15 18 9\"></polyline></svg>\n </summary>\n <div style=\"padding: 14px 16px; border-top: 1px solid #DCDCD8;\">\n <p style=\"font-size: 17px; text-wrap: pretty;\">{{ a.answer }}</p>\n <p style=\"margin-top: 10px; font-size: 14px; font-weight: 700; color: #0B4EA2;\">{{ a.cite }}</p>\n </div>\n </details>\n </li>\n </sc-for>\n </ul>\n\n <p style=\"margin-top: 16px; padding: 14px; max-width: 860px; background: #F7F7F5; border: 1px solid #DCDCD8; border-radius: 4px; font-size: 15px; color: #4A4A46;\">Outside the guide, the answer is \"not in the Hub Guide - ask the Supervisor or the EOC by radio\". Every question and answer is written to the activation record.</p>\n </section>\n </sc-if>\n\n <!-- ══════ SETTINGS ══════ -->\n <sc-if value=\"{{ showSettings }}\" hint-placeholder-val=\"{{ false }}\">\n <section data-screen-label=\"Settings\">\n <h1 style=\"font-size: clamp(26px, 5vw, 34px); font-weight: 800; letter-spacing: -0.03em; color: #000000;\">{{ ui.tSettings }}</h1>\n <p style=\"margin-top: 6px; font-size: 17px; color: #4A4A46; max-width: 68ch;\">What flows in, what flows out, and which model Kea is using. A coordinator on mains power runs this screen - a volunteer on a phone never needs it.</p>\n\n <h2 style=\"margin-top: 26px; font-size: clamp(20px, 4vw, 24px); font-weight: 800; color: #000000;\">Data coming in</h2>\n <ul style=\"margin-top: 12px; display: grid; gap: 8px;\">\n <sc-for list=\"{{ feedConfig }}\" as=\"f\" hint-placeholder-count=\"8\">\n <li style=\"padding: 12px 14px; background: #FFFFFF; border: 1px solid #DCDCD8; border-radius: 4px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;\">\n <span style=\"flex: 1 1 240px; min-width: 0; display: grid; gap: 2px;\">\n <strong style=\"font-size: 16px; color: #000000;\">{{ f.name }}</strong>\n <span style=\"font-size: 13px; color: #0B4EA2;\">{{ f.endpoint }}</span>\n <span style=\"font-size: 13px; color: #767671;\">{{ f.note }} · polls {{ f.interval }} · fetched {{ f.fetched }}</span>\n </span>\n <span style=\"padding: 2px 9px; border-radius: 4px; font-size: 12px; font-weight: 700; background: {{ f.bg }}; color: {{ f.ink }};\">{{ f.stateLabel }}</span>\n <button data-noprint=\"1\" type=\"button\" sc-camel-on-click=\"{{ f.toggle }}\" style=\"min-height: 44px; padding: 0 14px; background: #FFFFFF; color: #000000; border: 2px solid #000000; border-radius: 4px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;\">{{ f.toggleLabel }}</button>\n </li>\n </sc-for>\n </ul>\n\n <h2 style=\"margin-top: 26px; font-size: clamp(20px, 4vw, 24px); font-weight: 800; color: #000000;\">Data going out</h2>\n <p style=\"margin-top: 4px; font-size: 16px; color: #4A4A46; max-width: 68ch;\">All four channels read the same redacted view. Redaction lives in one place, never per channel.</p>\n <ul style=\"margin-top: 12px; display: grid; gap: 8px;\">\n <sc-for list=\"{{ channels }}\" as=\"c\" hint-placeholder-count=\"4\">\n <li style=\"padding: 12px 14px; background: #FFFFFF; border: 1px solid #DCDCD8; border-radius: 4px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;\">\n <span style=\"flex: 1 1 240px; min-width: 0; display: grid; gap: 2px;\">\n <strong style=\"font-size: 16px; color: #000000;\">{{ c.name }}</strong>\n <span style=\"font-size: 13px; color: #4A4A46;\">{{ c.detail }}</span>\n </span>\n <span style=\"padding: 2px 9px; border-radius: 4px; font-size: 12px; font-weight: 700; background: {{ c.bg }}; color: {{ c.ink }};\">{{ c.stateLabel }}</span>\n <button data-noprint=\"1\" type=\"button\" sc-camel-on-click=\"{{ c.toggle }}\" style=\"min-height: 44px; padding: 0 14px; background: #FFFFFF; color: #000000; border: 2px solid #000000; border-radius: 4px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;\">{{ c.btnLabel }}</button>\n </li>\n </sc-for>\n </ul>\n\n <div style=\"margin-top: 14px; padding: 14px 16px; background: {{ redactionBg }}; border: 2px solid {{ redactionInk }}; border-radius: 4px; display: grid; gap: 10px;\">\n <strong style=\"font-size: 16px; color: {{ redactionInk }};\">{{ redactionLabel }}</strong>\n <ul style=\"display: grid; gap: 4px;\">\n <sc-for list=\"{{ redactionRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n <li style=\"display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 15px;\"><strong style=\"flex: 0 0 190px; color: #000000;\">{{ r.field }}</strong><span style=\"flex: 1 1 200px;\">{{ r.rule }}</span></li>\n </sc-for>\n </ul>\n <sc-if value=\"{{ redactionGate }}\" hint-placeholder-val=\"{{ true }}\">\n <span style=\"font-size: 14px; font-weight: 700; color: #4A4A46;\">{{ redactionGate }}</span>\n </sc-if>\n <sc-if value=\"{{ canRedact }}\" hint-placeholder-val=\"{{ false }}\">\n <button data-noprint=\"1\" type=\"button\" sc-camel-on-click=\"{{ toggleRedaction }}\" style=\"justify-self: start; min-height: 44px; padding: 0 16px; background: #FFFFFF; color: {{ redactionInk }}; border: 2px solid {{ redactionInk }}; border-radius: 4px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;\">{{ redactionBtn }}</button>\n </sc-if>\n </div>\n\n <h2 style=\"margin-top: 26px; font-size: clamp(20px, 4vw, 24px); font-weight: 800; color: #000000;\">Kea - model connection</h2>\n <div style=\"margin-top: 12px; display: grid; gap: 12px; padding: 16px; background: #FFFFFF; border: 1px solid #DCDCD8; border-top: 4px solid #FFDD00; border-radius: 4px;\">\n <p style=\"font-size: 16px; text-wrap: pretty;\">{{ modelSummary }}</p>\n <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n <sc-for list=\"{{ modeButtons }}\" as=\"m\" hint-placeholder-count=\"2\">\n <button type=\"button\" sc-camel-on-click=\"{{ m.go }}\" aria-pressed=\"{{ m.pressed }}\" style=\"min-height: 44px; padding: 0 16px; background: {{ m.bg }}; color: {{ m.ink }}; border: 2px solid #000000; border-radius: 4px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;\">{{ m.label }}</button>\n </sc-for>\n </div>\n <label style=\"display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: #4A4A46;\">Model source\n <sc-raw-select value=\"{{ cfgProvider }}\" sc-camel-on-change=\"{{ setCfgProvider }}\" style=\"min-height: 44px; padding: 0 8px; background: #FFFFFF; border: 2px solid #767671; border-radius: 4px; font-family: inherit; font-size: 15px; font-weight: 700;\">\n <option value=\"builtin\">Built-in model (this page)</option>\n <option value=\"custom\">Own endpoint - Ollama, llama.cpp, hosted API</option>\n </sc-raw-select>\n </label>\n <label style=\"display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: #4A4A46;\">Endpoint\n <input value=\"{{ cfgEndpoint }}\" sc-camel-on-change=\"{{ setCfgEndpoint }}\" placeholder=\"http://192.168.1.20:11434/v1/chat/completions\" style=\"min-height: 44px; padding: 0 10px; border: 2px solid #767671; border-radius: 4px; font-family: inherit; font-size: 15px;\">\n </label>\n <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n <label style=\"flex: 1 1 160px; display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: #4A4A46;\">Model\n <input value=\"{{ cfgModel }}\" sc-camel-on-change=\"{{ setCfgModel }}\" placeholder=\"llama3.2\" style=\"min-height: 44px; padding: 0 10px; border: 2px solid #767671; border-radius: 4px; font-family: inherit; font-size: 15px;\">\n </label>\n <label style=\"flex: 1 1 160px; display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: #4A4A46;\">Key (blank for a local server)\n <input value=\"{{ cfgKey }}\" sc-camel-on-change=\"{{ setCfgKey }}\" type=\"password\" placeholder=\" - \" style=\"min-height: 44px; padding: 0 10px; border: 2px solid #767671; border-radius: 4px; font-family: inherit; font-size: 15px;\">\n </label>\n </div>\n <button data-noprint=\"1\" type=\"button\" sc-camel-on-click=\"{{ testModel }}\" style=\"justify-self: start; min-height: 46px; padding: 0 18px; background: #000000; color: #FFFFFF; border: 0; border-radius: 4px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;\">{{ testLabel }}</button>\n <sc-if value=\"{{ testResult }}\" hint-placeholder-val=\"{{ false }}\">\n <p style=\"padding: 10px 12px; background: {{ testBg }}; border-left: 4px solid {{ testInk }}; font-size: 15px; color: #1A1A18;\">{{ testResult.text }}</p>\n </sc-if>\n <p style=\"font-size: 14px; color: #4A4A46;\">Kea drafts and flags; a named person confirms. No model, over any channel, can assign a task, commit a volunteer, alter the roster, clear a need or close the Hub.</p>\n </div>\n\n <h2 style=\"margin-top: 26px; font-size: clamp(20px, 4vw, 24px); font-weight: 800; color: #000000;\">API access for the EOC</h2>\n <div style=\"margin-top: 12px; display: grid; gap: 10px; padding: 16px; background: #FFFFFF; border: 1px solid #DCDCD8; border-top: 4px solid #0B4EA2; border-radius: 4px;\">\n <span style=\"font-size: 15px;\"><strong>Base URL:</strong> https://hub-island-bay.local/api/v1</span>\n <span style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 15px;\">\n <strong>Bearer token:</strong>\n <code style=\"padding: 4px 8px; background: #F7F7F5; border: 1px solid #DCDCD8; border-radius: 4px; font-size: 14px;\">{{ token }}</code>\n <button data-noprint=\"1\" type=\"button\" sc-camel-on-click=\"{{ toggleToken }}\" style=\"min-height: 44px; padding: 0 14px; background: #FFFFFF; border: 2px solid #000000; border-radius: 4px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;\">{{ tokenBtn }}</button>\n <button data-noprint=\"1\" type=\"button\" sc-camel-on-click=\"{{ rotateToken }}\" style=\"min-height: 44px; padding: 0 14px; background: #FFDD00; border: 2px solid #000000; border-radius: 4px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;\">Issue a new token</button>\n </span>\n <span style=\"font-size: 14px; color: #4A4A46;\">Read-only except the status report the Hub pushes up. Gzipped. Rate limited to 60 requests a minute. Every call is written to the message register with the agent that made it.</span>\n </div>\n </section>\n </sc-if>\n\n <!-- ══════ RECORDS ══════ -->\n <sc-if value=\"{{ showRecords }}\" hint-placeholder-val=\"{{ false }}\">\n <section data-screen-label=\"Records\">\n <h1 style=\"font-size: clamp(26px, 5vw, 34px); font-weight: 800; letter-spacing: -0.03em; color: #000000;\">{{ ui.hRecords }}</h1>\n <p style=\"margin-top: 6px; font-size: 17px; color: #4A4A46; max-width: 64ch;\">Everything the paper kit collects, kept for the handover pack. Nothing here is deleted - closing an item hides it from the working view only.</p>\n\n <div style=\"margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start;\">\n <div style=\"padding: 16px; background: #FFFFFF; border: 1px solid #DCDCD8; border-top: 4px solid #0B4EA2; border-radius: 4px;\">\n <h2 style=\"font-size: 18px; font-weight: 800; color: #000000;\">Message log · VHF</h2>\n <ul style=\"margin-top: 10px; display: grid; gap: 10px;\">\n <sc-for list=\"{{ msgRows }}\" as=\"m\" hint-placeholder-count=\"5\">\n <li style=\"padding-left: 12px; border-left: 3px solid {{ m.rule }};\">\n <span style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 13px; color: #767671;\">\n <strong style=\"color: #000000; font-size: 14px; font-variant-numeric: tabular-nums;\">{{ m.time }}</strong>\n <span style=\"font-weight: 700; color: {{ m.rule }};\">{{ m.dir }}</span>\n <span>{{ m.party }}</span>\n </span>\n <p style=\"font-size: 15px;\">{{ m.content }}</p>\n </li>\n </sc-for>\n </ul>\n </div>\n\n <div style=\"padding: 16px; background: #FFFFFF; border: 1px solid #DCDCD8; border-top: 4px solid #000000; border-radius: 4px;\">\n <h2 style=\"font-size: 18px; font-weight: 800; color: #000000;\">Decisions</h2>\n <ul style=\"margin-top: 10px; display: grid; gap: 10px;\">\n <sc-for list=\"{{ decisionRows }}\" as=\"d\" hint-placeholder-count=\"3\">\n <li>\n <span style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 13px; color: #767671;\">\n <strong style=\"color: #000000; font-size: 14px; font-variant-numeric: tabular-nums;\">{{ d.time }}</strong>\n <span>{{ d.who }}</span>\n </span>\n <p style=\"font-size: 16px; font-weight: 700; color: #000000;\">{{ d.decision }}</p>\n <p style=\"font-size: 14px; color: #4A4A46;\">{{ d.context }}</p>\n </li>\n </sc-for>\n </ul>\n </div>\n </div>\n\n <div style=\"margin-top: 16px; padding: 16px; background: #FBEAE8; border: 1px solid #B3261E; border-radius: 4px; max-width: 70ch;\">\n <strong style=\"font-size: 16px; color: #B3261E;\">Keep repeating these</strong>\n <ul style=\"margin-top: 8px; display: grid; gap: 6px; font-size: 15px;\">\n <li>People at the Hub have no legal powers - nothing can be taken or ordered.</li>\n <li>Life-threatening needs are dealt with immediately - still try 111.</li>\n <li>Nobody goes out alone. Plan the route, agree a return time.</li>\n <li>Community Space assists distressed people; it does not counsel them.</li>\n <li>Media: nothing personal, private, or about deaths, injuries or evacuated addresses.</li>\n </ul>\n </div>\n </section>\n </sc-if>\n\n </main>\n\n <sc-if value=\"{{ asstClosed }}\" hint-placeholder-val=\"{{ true }}\">\n <button data-noprint=\"1\" type=\"button\" sc-camel-on-click=\"{{ openAsst }}\" style=\"position: fixed; right: clamp(12px, 2vw, 24px); bottom: clamp(12px, 2vw, 24px); z-index: 90; min-height: 56px; padding: 0 20px 0 16px; display: inline-flex; align-items: center; gap: 10px; background: #000000; color: #FFFFFF; border: 3px solid #FFDD00; border-radius: 999px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);\">\n <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFDD00\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 20l1.1-4a8.4 8.4 0 0 1-1-4A8.5 8.5 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z\"></path><circle cx=\"8.4\" cy=\"11.5\" r=\"1\"></circle><circle cx=\"12\" cy=\"11.5\" r=\"1\"></circle><circle cx=\"15.6\" cy=\"11.5\" r=\"1\"></circle></svg>\n <span>{{ ui.askGuide }}</span>\n </button>\n </sc-if>\n\n <sc-if value=\"{{ asstOpen }}\" hint-placeholder-val=\"{{ false }}\">\n <aside data-noprint=\"1\" aria-label=\"Kea, the Hub guide assistant\" style=\"position: fixed; right: clamp(6px, 2vw, 24px); bottom: 0; z-index: 95; width: min(600px, calc(100vw - 16px)); max-h px; display: grid; place-items: center; background: transparent; color: #FFFFFF; border: 2px solid #4A4A46; border-radius: 4px; font-family: inherit; font-size: 20px; font-weight: 800; cursor: pointer;\" style-hover=\"border-color: #FFDD00;\">×</button>\n </div>\n\n <div style=\"flex: none; padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; background: #F7F7F5; border-bottom: 1px solid #DCDCD8;\">\n <div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center;\">\n <sc-for list=\"{{ modeButtons }}\" as=\"m\" hint-placeholder-count=\"2\">\n <button type=\"button\" sc-camel-on-click=\"{{ m.go }}\" aria-pressed=\"{{ m.pressed }}\" style=\"min-height: 40px; padding: 0 14px; background: {{ m.bg }}; color: {{ m.ink }}; border: 2px solid #000000; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;\">{{ m.label }}</button>\n </sc-for>\n </div>\n <button type=\"button\" sc-camel-on-click=\"{{ toggleSources }}\" aria-pressed=\"{{ sourcesOpen }}\" style=\"min-height: 40px; width: 100%; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #FFFFFF; color: #0B4EA2; border: 2px solid #DCDCD8; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;\">\n <span aria-hidden=\"true\" style=\"width: 9px; height: 9px; border-radius: 999px; background: #0B6B3A; flex: none;\"></span>\n <span>{{ sourceCount }} sources connected</span>\n </button>\n </div>\n\n <div ref=\"{{ chatRef }}\" style=\"flex: 1 1 auto; min-height: 0; overflow-y: auto; background: #EDEDEA;\">\n <sc-if value=\"{{ sourcesOpen }}\" hint-placeholder-val=\"{{ false }}\">\n <ul style=\"padding: 10px 12px; display: grid; gap: 6px; background: #FFFFFF; border-bottom: 1px solid #DCDCD8;\">\n <sc-for list=\"{{ sources }}\" as=\"s\" hint-placeholder-count=\"6\">\n <li style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; justify-content: space-between; font-size: 14px;\">\n <span style=\"flex: 1 1 160px; min-width: 0; color: #1A1A18;\">{{ s.name }}</span>\n <span style=\"font-size: 12px; font-weight: 700; color: {{ s.ink }};\">{{ s.kind }}</span>\n </li>\n </sc-for>\n </ul>\n </sc-if>\n\n <sc-if value=\"{{ asstCfgOpen }}\" hint-placeholder-val=\"{{ false }}\">\n <div style=\"padding: 12px; display: grid; gap: 10px; background: #F7F7F5; border-bottom: 1px solid #DCDCD8;\">\n <div style=\"display: flex; gap: 6px;\">\n <sc-for list=\"{{ modeButtons }}\" as=\"m\" hint-placeholder-count=\"2\">\n <button type=\"button\" sc-camel-on-click=\"{{ m.go }}\" aria-pressed=\"{{ m.pressed }}\" style=\"flex: 1 1 0; min-height: 44px; padding: 0 12px; background: {{ m.bg }}; color: {{ m.ink }}; border: 2px solid #000000; border-radius: 4px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;\">{{ m.label }}</button>\n </sc-for>\n </div>\n <label style=\"display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: #4A4A46;\">Model source\n <sc-raw-select value=\"{{ cfgProvider }}\" sc-camel-on-change=\"{{ setCfgProvider }}\" style=\"min-height: 44px; padding: 0 8px; background: #FFFFFF; border: 2px solid #767671; border-radius: 4px; font-family: inherit; font-size: 15px; font-weight: 700;\">\n <option value=\"builtin\">Built-in model (this page)</option>\n <option value=\"custom\">Own endpoint - Ollama, llama.cpp, hosted API</option>\n </sc-raw-select>\n </label>\n <p style=\"font-size: 13px; color: #4A4A46; text-wrap: pretty;\">{{ cfgHint }}</p>\n <label style=\"display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: #4A4A46;\">Endpoint\n <input value=\"{{ cfgEndpoint }}\" sc-camel-on-change=\"{{ setCfgEndpoint }}\" placeholder=\"http://192.168.1.20:11434/v1/chat/completions\" style=\"min-height: 44px; padding: 0 10px; background: #FFFFFF; border: 2px solid #767671; border-radius: 4px; font-family: inherit; font-size: 15px;\">\n </label>\n <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n <label style=\"flex: 1 1 140px; display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: #4A4A46;\">Model\n <input value=\"{{ cfgModel }}\" sc-camel-on-change=\"{{ setCfgModel }}\" placeholder=\"llama3.2\" style=\"min-height: 44px; padding: 0 10px; background: #FFFFFF; border: 2px solid #767671; border-radius: 4px; font-family: inherit; font-size: 15px;\">\n </label>\n <label style=\"flex: 1 1 140px; display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: #4A4A46;\">Key (blank for local)\n <input value=\"{{ cfgKey }}\" sc-camel-on-change=\"{{ setCfgKey }}\" type=\"password\" placeholder=\" - \" style=\"min-height: 44px; padding: 0 10px; background: #FFFFFF; border: 2px solid #767671; border-radius: 4px; font-family: inherit; font-size: 15px;\">\n </label>\n </div>\n <p style=\"font-size: 13px; color: #4A4A46;\">The on-device answer is always the floor: if the model is unreachable, the question is still answered from the guide held here.</p>\n </div>\n </sc-if>\n\n <ul style=\"padding: 12px; display: grid; gap: 10px; align-content: start; background: #EDEDEA;\">\n <sc-for list=\"{{ asstMsgs }}\" as=\"m\" hint-placeholder-count=\"2\">\n <li style=\"display: flex; justify-content: {{ m.justify }};\">\n <span style=\"max-width: 96%; padding: 12px 14px; background: {{ m.bg }}; border: 1px solid {{ m.border }}; border-radius: 6px; display: grid; gap: 6px;\">\n <span class=\"hubnode-md\" data-md=\"{{ m.text }}\" style=\"font-size: 15px; line-height: 1.55; color: #1A1A18; display: block; white-space: pre-wrap;\">{{ m.text }}</span>\n <sc-if value=\"{{ m.cite }}\" hint-placeholder-val=\"{{ true }}\">\n <span style=\"font-size: 12px; font-weight: 700; color: #0B4EA2;\">{{ m.cite }}</span>\n </sc-if>\n <sc-if value=\"{{ m.note }}\" hint-placeholder-val=\"{{ false }}\">\n <span style=\"font-size: 12px; color: #8A5A00;\">{{ m.note }}</span>\n </sc-if>\n <sc-if value=\"{{ m.canMakeTask }}\" hint-placeholder-val=\"{{ false }}\">\n <button type=\"button\" sc-camel-on-click=\"{{ m.makeTask }}\" style=\"justify-self: start; min-height: 40px; padding: 0 12px; display: inline-flex; align-items: center; gap: 7px; background: #FFDD00; color: #000000; border: 2px solid #000000; border-radius: 4px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;\">\n <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"></line><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"></line></svg>\n Turn this into a task\n </button>\n </sc-if>\n </span>\n </li>\n </sc-for>\n </ul>\n\n <sc-if value=\"{{ asstDraft }}\" hint-placeholder-val=\"{{ false }}\">\n <div style=\"padding: 12px; display: grid; gap: 10px; background: #FFFBE0; border-top: 2px solid #8A5A00;\">\n <strong style=\"font-size: 15px; color: #5C4E00;\">Suggested task - you are the check. Read it, fix it, then confirm.</strong>\n <label style=\"display: grid; gap: 4px; font-size: 12px; font-weight: 700; color: #4A4A46;\">What to do\n <input value=\"{{ draftTaskTitle }}\" sc-camel-on-change=\"{{ setDraftTaskTitle }}\" style=\"min-height: 44px; padding: 0 10px; border: 2px solid #767671; border-radius: 4px; font-family: inherit; font-size: 15px;\">\n </label>\n <label style=\"display: grid; gap: 4px; font-size: 12px; font-weight: 700; color: #4A4A46;\">How - one step per line\n <textarea value=\"{{ draftTaskHow }}\" sc-camel-on-change=\"{{ setDraftTaskHow }}\" rows=\"4\" style=\"width: 100%; padding: 8px; border: 2px solid #767671; border-radius: 4px; font-family: inherit; font-size: 15px;\"></textarea>\n </label>\n <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n <label style=\"flex: 1 1 150px; display: grid; gap: 4px; font-size: 12px; font-weight: 700; color: #4A4A46;\">Suggested role\n <sc-raw-select value=\"{{ draftTaskRole }}\" sc-camel-on-change=\"{{ setDraftTaskRole }}\" style=\"min-height: 44px; padding: 0 8px; border: 2px solid #767671; border-radius: 4px; font-family: inherit; font-size: 15px; font-weight: 700;\">\n <sc-for list=\"{{ roleOptions }}\" as=\"r\" hint-placeholder-count=\"8\">\n <option value=\"{{ r.name }}\">{{ r.name }}</option>\n </sc-for>\n </sc-raw-select>\n </label>\n <label style=\"flex: 1 1 150px; display: grid; gap: 4px; font-size: 12px; font-weight: 700; color: #4A4A46;\">Suggested person\n <sc-raw-select value=\"{{ draftTaskPerson }}\" sc-camel-on-change=\"{{ setDraftTaskPerson }}\" style=\"min-height: 44px; padding: 0 8px; border: 2px solid #767671; border-radius: 4px; font-family: inherit; font-size: 15px; font-weight: 700;\">\n <sc-for list=\"{{ personOptions }}\" as=\"p\" hint-placeholder-count=\"13\">\n <option value=\"{{ p.name }}\">{{ p.option }}</option>\n </sc-for>\n </sc-raw-select>\n </label>\n </div>\n <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n <label style=\"flex: 1 1 150px; display: grid; gap: 4px; font-size: 12px; font-weight: 700; color: #4A4A46;\">When\n <input value=\"{{ draftTaskWhen }}\" sc-camel-on-change=\"{{ setDraftTaskWhen }}\" style=\"min-height: 44px; padding: 0 10px; border: 2px solid #767671; border-radius: 4px; font-family: inherit; font-size: 15px;\">\n </label>\n <label style=\"flex: 1 1 150px; display: grid; gap: 4px; font-size: 12px; font-weight: 700; color: #4A4A46;\">Reference\n <input value=\"{{ draftTaskRef }}\" sc-camel-on-change=\"{{ setDraftTaskRef }}\" style=\"min-height: 44px; padding: 0 10px; border: 2px solid #767671; border-radius: 4px; font-family: inherit; font-size: 15px;\">\n </label>\n </div>\n <p style=\"font-size: 13px; color: #5C4E00;\">The assistant cannot assign anyone by itself. Confirming records your name against the assignment.</p>\n <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n <button type=\"button\" sc-camel-on-click=\"{{ confirmAsstDraft }}\" style=\"min-height: 46px; padding: 0 16px; background: #000000; l an official all-clear. Live alerts cannot be reached - listen to the radio for the all-clear.\", distance: \"650 m north-east, uphill\", provenance: \"LIVE DATA UNAVAILABLE - answered from hazard zones stored on this device, vintage 2024-11, cached 14 Aug 06:02. The zone layer is the life-safety floor and works with no signal.\" }\n ],\n assist: [\n { q: \"How do we treat drinking water if we can't boil it?\", type: \"grounded\", answer: \"Boiling is best - a rolling boil for 1 minute, filtering cloudy water through clean cloth first. If you cannot boil: add 2 drops of plain unscented household bleach per litre, stir well, stand 30 minutes, and store covered.\", cite: \"Hub Guide §5 - Water, p.36\" },\n { q: \"A journalist is here - what can we tell them?\", type: \"grounded\", answer: \"You may share what they can already see, general hub information, and public information received from the EOC. Do not share personal information, private or confidential information, details of deaths or injuries, or the addresses of evacuated homes. If you are unsure, refer them to the Hub Supervisor.\", cite: \"Hub Guide - Supervisor p.12 / Public Information p.16\" },\n { q: \"Should the people on The Esplanade evacuate right now?\", type: \"refusal\", answer: \"I don't give evacuation advice. If the quake was LONG or STRONG: get gone - inland or uphill now, on foot if you can, without waiting for any alert. Check the zone in \\\"Am I impacted?\\\". Official channels: radio, WREMO, NEMA. Life-threatening: 111.\", cite: \"Fixed response - personal-safety questions are never reasoned about\" },\n { q: \"Where should injured people go?\", type: \"grounded\", answer: \"The nearest OPEN medical centre first, not the hospital - the medical centre assesses who needs hospital care. People with first-aid skills: the nearest open medical centre or the hub. Life-threatening situations: keep trying 111.\", cite: \"Hub Guide §5 - Medical assistance p.34; Key resource statements p.39\" }\n
